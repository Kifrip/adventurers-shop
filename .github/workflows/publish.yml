name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    uses: procrastinate-games/game-publisher/.github/workflows/publish.yml@v1
    secrets: inherit
    with:
      post-build-command: |
        npx playwright install --with-deps chromium
        npm run preview -- --host 127.0.0.1 > /tmp/shop-preview.log 2>&1 &
        shop_preview_pid=$!
        trap 'kill "$shop_preview_pid"' EXIT
        for attempt in {1..30}; do
          if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
          sleep 1
        done
        TEST_URL=http://127.0.0.1:4173 npm run test:smoke
