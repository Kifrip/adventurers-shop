name: Check game
# Checks only. Publishing is done by Cloudflare Workers Builds (see wrangler.jsonc).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run the full mobile and theme checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check game rules
        run: npm test
      - name: Build game
        run: npm run build
      - name: Cache browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install browser for touch tests
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check gameplay
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/shop-preview.log 2>&1 &
          shop_preview_pid=$!
          trap 'kill "$shop_preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.full_tests }}" = "true" ]; then
            TEST_URL=http://127.0.0.1:4173 npm run test:mobile
            TEST_URL=http://127.0.0.1:4173 npm run test:theme
          else
            TEST_URL=http://127.0.0.1:4173 npm run test:smoke
          fi
