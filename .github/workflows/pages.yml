name: Check game build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check game rules
        run: npm test
      - name: Build game
        run: npm run build
      - name: Upload checked build
        uses: actions/upload-artifact@v4
        with:
          name: game-dist
          path: dist
