name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check game rules
        run: npm test
      - name: Build game
        run: npm run build
      - name: Install browser for touch tests
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check mobile gameplay and themes
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/shop-preview.log 2>&1 &
          shop_preview_pid=$!
          trap 'kill "$shop_preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          TEST_URL=http://127.0.0.1:4173 npm run test:mobile
          TEST_URL=http://127.0.0.1:4173 npm run test:theme
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
